# XcodeGen spec. Regenerate the Xcode project with: cd ios && xcodegen
name: ArmenianKeyboard
options:
  bundleIdPrefix: io.github.aramp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ArmenianKeyboard:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: Keyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aramp.armeniankeyboard
        PRODUCT_NAME: Armenian Keyboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Հայերեն
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Armenian Phonetic
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: hy
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aramp.armeniankeyboard.keyboard
        PRODUCT_NAME: Keyboard
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        APPLICATION_EXTENSION_API_ONLY: YES
