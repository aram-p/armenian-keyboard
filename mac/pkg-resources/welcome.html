<h2>Armenian Phonetic Plus</h2>
<p>This installs the <b>Armenian Phonetic Plus</b> keyboard layout for every user on this Mac.</p>
<p>Letters sit on the English keys that sound the same. The Armenian full stop ։ is on the period key, « » on Shift+, and Shift+. — hold Option to type English.</p>
